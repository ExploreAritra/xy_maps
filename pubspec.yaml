name: xy_maps
description: "A Flutter package to place markers with rich text comments on floor plan images, with GeoJSON support."
version: 0.0.1
homepage: https://github.com/ExploreAritra/xy_maps
repository: https://github.com/ExploreAritra/xy_maps

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_quill: ^11.4.0
  provider: ^6.1.5
  uuid: ^4.5.1
  vector_math: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
